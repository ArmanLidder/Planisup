<div class="search-container">
  <div class="content-search">
    <mat-form-field appearance="outline" class="search-bar">
      <mat-label>Nom ou prénom...</mat-label>
      <input matInput type="text" (input)="onSearch($event.target.value)" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Diplôme</mat-label>
      <mat-select [(value)]="selectedDegree" (selectionChange)="filterBySelectedValue()">
        <mat-option>---</mat-option>
        <mat-option *ngFor="let degree of degrees" [value]="degree">
          {{ degree }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Année</mat-label>
      <mat-select [(value)]="selectedYear" (selectionChange)="filterBySelectedValue()">
        <mat-option>---</mat-option>
        <mat-option *ngFor="let year of years" [value]="year">
          {{ year }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-table [dataSource]="filteredPlans" class="cdk-table mat-elevation-z2">
    <ng-container matColumnDef="firstName">
      <mat-header-cell *matHeaderCellDef> Prénom </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.firstName }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="lastName">
      <mat-header-cell *matHeaderCellDef> Nom </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.lastName }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="degree">
      <mat-header-cell *matHeaderCellDef> Diplôme </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.degree }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ formatDate(row.date) }} </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns" class="table-header"></mat-header-row>
    <mat-row
      *matRowDef="let row; columns: displayedColumns"
      class="clickable-row"
      (click)="onRowClick(row)"
      [class.selected]="selectedRow?.studyPlanId === row.studyPlanId">
    </mat-row>
  </mat-table>

  <div *ngIf="filteredPlans.length === 0" class="no-courses">
    Aucun plan d'étude trouvé
  </div>
</div>
