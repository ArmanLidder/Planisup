<div class="steps-progress">
  <div class="container" #container>
    <ng-container *ngFor="let item of itemProgressList; index as i">
      <div class="check-box"
           [class.complete]="item.status === 'complété'"
           [class.active]="item.status === 'en cours'">
        <svg id="checkbox" viewBox="0 0 100 100">
          <circle class="circle" cx="50.5" cy="49" r="45"></circle>
          <polyline class="check" points="28.5,51.9 41.9,65.3 72.5,32.8"></polyline>
        </svg>
        <div class="info">
          <span class="step">Étape {{ i + 1 }}</span>
          <span class="progress-info"
                [class.complete]="item.status === 'complété'"
                [class.active]="item.status === 'en cours'">
            {{ item.status }}
          </span>
        </div>
        <div class="progress-line"
             [class.complete]="item.status === 'complété'"
             [class.active]="item.status === 'en cours'"
             *ngIf="i < itemProgressList.length - 1">
          <div class="progress-percent"></div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
