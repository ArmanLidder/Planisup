<div class="programs-container">
  <div class="container-left">
    <div class="left-header">
      <div class="header-search-program">
        <input
          type="text"
          placeholder="Rechercher un programme..."
          (input)="onSearch($event.target.value)"
        />
      </div>
      <div class="header-add-program" (click)="createProgram()">
        <img src="./../../../assets/image_add.png" alt="" />
      </div>
    </div>
    <div class="programs-list">
      <div
        *ngFor="let option of allPrograms$ | async | keyvalue"
        class="program-item"
        [class.selected]="selectedProgramId === option.key"
        (click)="selectProgram(option.key)"
      >
        {{ option.value }}
      </div>
      <p class="no-program-message" *ngIf="allPrograms.getValue().size === 0">
        Aucun programme trouvé
      </p>
    </div>
  </div>
  <div class="container-right">
    <div *ngIf="!selectedProgramId" class="no-program-selected">
      <img src="./../../../assets/image_select.png" alt="" />
      <h3>
        Sélectionnez un programme dans la liste affichée afin d'interagir avec un plan d'étude.
      </h3>
      <h3>
        Appuyez sur le bouton d'ajout situé à droite de la barre de recherche pour ajouter un
        programme.
      </h3>
    </div>
    <ng-container *ngIf="selectedProgramId && programService.program">
      <div
        class="right-toolbar"
        *ngIf="isEditing"
      >
        <button
          mat-stroked-button
          color="primary"
          (click)="togglePreview()"
        >
          {{ isPreviewing ? 'Revenir à l’édition' : 'Prévisualiser le plan' }}
        </button>
        <button
          mat-flat-button
          color="primary"
          (click)="saveProgram()"
          [disabled]="isSaving"
        >
          {{ isDraftSelected ? 'Créer le programme' : 'Enregistrer les modifications' }}
        </button>
        <button
          mat-flat-button
          color="warn"
          (click)="requestExit()"
        >
          Quitter l’édition
        </button>
      </div>

      <div class="right-content" [class.has-toolbar]="isEditing">
        <app-program-editor
          #programEditor
          *ngIf="isEditing && !isPreviewing"
          [program]="programService.program!"
          [isNew]="isDraftSelected"
          (programChange)="onProgramChange($event)"
        ></app-program-editor>

        <app-study-plan
          *ngIf="(!isEditing) || isPreviewing"
        ></app-study-plan>
      </div>
    </ng-container>
  </div>
</div>
