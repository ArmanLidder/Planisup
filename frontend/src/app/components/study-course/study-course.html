<div class="study-course" 
     [class.selected]="isSelected" 
     [class.disabled]="isDisabled">
  <label class="course-checkbox">
    <input type="checkbox" 
           [checked]="isSelected"
           [disabled]="isDisabled"
           (change)="onSelectionChange($any($event.target).checked)"
           [title]="isDisabled && !isSelected ? 'Ce cours est déjà sélectionné dans un autre module' : ''">
    <span class="checkmark"></span>
    <span class="course-code">{{ course.sigle }}</span>
    <span class="course-name">{{ course.name }}</span>
    <span class="course-credits">{{ course.credits }} crédits</span>
    
    <span class="already-selected-icon" *ngIf="isSelected">
      ✓
    </span>
  </label>
  
  <div class="selection-info" *ngIf="selectionInfo">
    {{ selectionInfo }}
  </div>
</div>
