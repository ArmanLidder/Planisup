<div class="study-course" 
     [class.selected]="isSelected" 
     [class.disabled]="isDisabled"
     [class.view-mode]="isViewMode"
     [class.director-approval-highlight]="isViewMode && isSelected && isSectionHighlight"
     [class.credits-limit-reached]="isDisabled && !isSelected">
  <label class="course-checkbox" [class.disabled-label]="!canBeToggled()">
    <!-- En mode view, pas de checkbox -->
    <ng-container *ngIf="!isViewMode">
      <input type="checkbox" 
             [checked]="isSelected"
             [disabled]="!canBeToggled()"
             (change)="onSelectionChange($any($event.target).checked)">
      <span class="checkmark" [class.disabled-checkmark]="!canBeToggled()"></span>
    </ng-container>
    
    <!-- Badge pour indiquer l'approbation du directeur en mode view -->
    <span class="director-badge" *ngIf="isViewMode && isSelected && isSectionHighlight">
      👨‍💼
    </span>
    
    <span class="course-code">{{ course.sigle }}</span>
    <span class="course-name" [class.disabled-text]="!canBeToggled()">{{ course.name }}</span>
    
    <!-- Section Avantage Poly intégrée dans la ligne -->
    <div class="avantage-poly-inline" *ngIf="isSelected">
      <label class="avantage-poly-checkbox">
        <input type="checkbox" 
               [checked]="isAvantagePolyChecked"
               (change)="onAvantagePolyChange($event)"
               *ngIf="!isViewMode">
        <span class="avantage-checkmark" *ngIf="!isViewMode"></span>
        <span class="avantage-poly-label" *ngIf="!isViewMode">Avantage Poly</span>
        <span class="avantage-poly-label" *ngIf="currentGrade && isViewMode">Avantage Poly</span>
        <span class="current-grade" *ngIf="currentGrade && isViewMode"> - {{ currentGrade }}</span>
      </label>
      
      <!-- Dropdown pour sélectionner la note -->
      <div class="grade-selector" *ngIf="isAvantagePolyChecked && !isViewMode">
        <select 
          class="grade-dropdown"
          [value]="currentGrade || ''"
          (change)="onGradeSelect($any($event.target).value)">
          <option value="" disabled>Sélectionnez une note</option>
          <option *ngFor="let grade of grades" [value]="grade">
            {{ grade }}
          </option>
        </select>
      </div>
    </div>
    
    <!-- NOUVEAU : Sélection du trimestre -->
    <div class="trimester-selector" *ngIf="needsTrimesterSelection">
      <label for="trimesterSelect">Sélectionnez un trimestre :</label>
      <select 
        id="trimesterSelect"
        class="trimester-dropdown"
        (change)="onTrimesterSelect($event.target.value)">
        <option value="" disabled selected>Choisir un trimestre</option>
        <option *ngFor="let trimester of availableTrimesters"
          [value]="trimester.term + ' ' + trimester.year"
          [selected]="trimester.term + ' ' + trimester.year === selectedTrimester"
          >
          {{ trimester.term}} {{ trimester.year }}
        </option>
      </select>
    </div>
    
    <!-- Affichage du trimestre sélectionné en mode view -->
    <div class="trimester-display" *ngIf="isViewMode && isSelected && selectedTrimester">
      <span class="trimester-label">📅 {{ selectedTrimester}}</span>
    </div>
    
    <span class="course-credits" [class.disabled-text]="!canBeToggled()">{{ course.credits }} crédits</span>
    
    <!-- Icône de sélection seulement en mode édition -->
    <span class="already-selected-icon" *ngIf="!isViewMode && isSelected && !isDisabled">
      ✓
    </span>
    
    <!-- Icône de blocage seulement en mode édition -->
    <span class="blocked-icon" *ngIf="!isViewMode && isDisabled && !isSelected">
      ⚠️
    </span>
  </label>
  <!-- Info de sélection seulement en mode édition -->
  <div class="selection-info" *ngIf="!isViewMode && selectionInfo" 
       [class.error-info]="isDisabled">
    {{ selectionInfo }}
  </div>
</div>
