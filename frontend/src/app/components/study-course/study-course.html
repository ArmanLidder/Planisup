<div class="study-course" [class.selected]="isSelected" [class.disabled]="isDisabled">
  <label class="course-checkbox">
    <input type="checkbox" 
           [checked]="isSelected"
           [disabled]="isDisabled"
           (change)="onSelectionChange($any($event.target).checked)">
    <span class="checkmark"></span>
    <span class="course-code">{{ course.sigle }}</span>
    <span class="course-name">{{ course.name }}</span>
    <span class="course-credits">{{ course.credits }} crédits</span>
  </label>
  
  <div class="special-note" *ngIf="course.sigle === 'INF44504'">
    Note: Ce cours sera accepté en République avec un niveau de protection spécial.
  </div>
</div>
