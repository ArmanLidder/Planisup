<div class="study-module">
  <div class="module-header">
    <h2>{{ title }}</h2>
    <div class="module-credits">
      <span class="credits-count">{{ selectedCredits }} / {{ credits }}</span>
      <span class="credits-label">Crédits</span>
    </div>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" [ngStyle]="getModuleProgressStyle()"></div>
  </div>
  
  <div class="module-description" *ngIf="module.description && module.description.length">
    <p *ngFor="let desc of module.description">{{ desc }}</p>
  </div>
  
  <div class="sections" *ngIf="module.courses && module.courses.length">
    <app-study-section 
      *ngFor="let section of module.courses" 
      [section]="section"
      (courseSelectionChange)="onCourseSelectionChange($event)">
    </app-study-section>
  </div>

  <div class="sub-modules" *ngIf="module.subModules && module.subModules.length">
    <div class="sub-module" *ngFor="let subModule of module.subModules">
      <h3>{{ getModuleTitleWithoutCredits(subModule.title) }}</h3>
      
      <div class="sub-module-description" *ngIf="subModule.description && subModule.description.length">
        <p *ngFor="let desc of subModule.description">{{ desc }}</p>
      </div>
      
      <div class="sections" *ngIf="subModule.courses && subModule.courses.length">
        <app-study-section 
          *ngFor="let section of subModule.courses" 
          [section]="section"
          (courseSelectionChange)="onCourseSelectionChange($event)">
        </app-study-section>
      </div>
    </div>
  </div>
</div>
