<div class="study-section" 
     [class.rule-section]="isFirstInRuleGroup"
     [class.rule-group-section]="isInRuleGroup && !isFirstInRuleGroup"
     [class.director-approval-section]="isDirectorApprovalSection"
     [class.minimum-rule-section]="isMinimumRuleSection">
  <div class="section-header" *ngIf="section.description">
    <h3 [class.rule-title]="isFirstInRuleGroup" 
        [class.group-section-title]="isInRuleGroup && !isFirstInRuleGroup"
        [class.director-approval-title]="isDirectorApprovalSection"
        [class.minimum-rule-title]="isMinimumRuleSection">
      {{ section.description }}
    </h3>
    
    <!-- Affichage du statut seulement pour la première section du groupe -->
    <!-- Ne pas afficher pour les sections credits_minimum -->
    <div class="section-status" *ngIf="isFirstInRuleGroup && hasRequiredCredits && !isMinimumRuleSection">
      <div class="credits-info">
        <span class="credits-count">{{ sectionStatus.selectedCredits }} / {{ sectionStatus.requiredCredits }}</span>
        <span class="credits-label">crédits</span>
      </div>
      
      <div class="progress-bar-small">
        <div class="progress-fill-small" 
             [style.width.%]="progressPercentage"
             [style.background-color]="getProgressColor()">
        </div>
      </div>
    </div>
  </div>
  
  <!-- Cours normaux de la section -->
  <div class="courses-list" *ngIf="section.courses && section.courses.length > 0">
    <app-study-course 
      *ngFor="let course of section.courses" 
      [course]="course"
      [currentModuleTitle]="currentModuleTitle"
      [currentSubmoduleTitle]="currentSubmoduleTitle"
      [currentSectionDescription]="section.description"
      (selectionChange)="onCourseSelectionChange($event)">
    </app-study-course>
  </div>
  
  <!-- Composant de recherche pour les sections avec approbation du directeur -->
  <div class="director-approval-search" *ngIf="isDirectorApprovalSection">
    <app-course-search
      [allCourses]="allCourses"
      [maxCredits]="sectionRule?.requiredCredits || 0"
      [currentModuleTitle]="currentModuleTitle"
      [currentSubmoduleTitle]="currentSubmoduleTitle"
      [currentSectionDescription]="section.description"
      (courseSelectionChange)="onSearchCourseSelectionChange($event)">
    </app-course-search>
  </div>
</div>
