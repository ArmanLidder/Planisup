<div class="study-section" 
     [class.director-approval-section]="isDirectorApprovalSection"
     [class.minimum-rule-section]="isMinimumRuleSection"
     [class.rule-section]="isRuleExact">
  <div class="section-header" *ngIf="section.description">
    <h3 [class.director-approval-title]="isDirectorApprovalSection"
        [class.minimum-rule-title]="isMinimumRuleSection"
        [class.rule-title]="isRuleExact">
      {{ section.description }}
    </h3>
    
    <!-- Affichage du statut seulement pour la première section du groupe -->
    <!-- Ne pas afficher pour les sections credits_minimum -->
    <!-- Ne pas afficher en mode view -->
    <div class="section-status" *ngIf="!isViewMode && hasRequiredCredits && !isMinimumRuleSection">
      <div class="credits-info">
        <span class="credits-count">{{ selectedCredits }} / {{ requiredCredits }}</span>
        <span class="credits-label">crédits</span>
      </div>
      
      <div class="progress-bar-small">
        <div class="progress-fill-small" 
             [style.width.%]="progressPercentage"
             [style.background-color]="getProgressColor()">
        </div>
      </div>
    </div>
  </div>
  
  <!-- Cours normaux de la section ET cours ajoutés via course-search -->
  <div class="courses-list" *ngIf="sectionCourses.length > 0">
    <app-study-course 
      *ngFor="let course of sectionCourses" 
      [course]="course"
      [currentModuleTitle]="currentModuleTitle"
      [currentSubmoduleTitle]="currentSubmoduleTitle"
      [currentSectionDescription]="section.description"
      [isViewMode]="isViewMode"
      (selectionChange)="onCourseSelectionChange($event)">
    </app-study-course>
  </div>
  
  <!-- Composant de recherche pour les sections avec approbation du directeur -->
  <!-- Ne pas afficher en mode view car les cours sont déjà dans la liste -->
  <div class="director-approval-search" *ngIf="!isViewMode && isDirectorApprovalSection">
    <app-course-search
      #courseSearchComponent
      [allCourses]="allCourses"
      [maxCredits]="requiredCredits || 0"
      [maxCourses]="999"
      [currentModuleTitle]="currentModuleTitle"
      [currentSubmoduleTitle]="currentSubmoduleTitle"
      [currentSectionDescription]="section.description"
      (courseSelectionChange)="onSearchCourseSelectionChange($event)">
    </app-course-search>
  </div>
</div>
