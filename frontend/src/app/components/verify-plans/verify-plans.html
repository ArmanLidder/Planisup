<div class="full-width-table-container">
  <mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="matricule">
      <mat-header-cell *matHeaderCellDef> Matricule </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{row.matricule}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="nomEtudiant">
      <mat-header-cell *matHeaderCellDef> Nom Étudiant </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{row.nomEtudiant}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="plan">
      <mat-header-cell *matHeaderCellDef> Plan </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{row.plan}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="date">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Date </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{row.date}} </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns" class="table-header"></mat-header-row>

    <mat-row *matRowDef="let row; columns: displayedColumns;"
     class="clickable-row" 
     (click)="onRowClick(row)"
     [class.selected]="selectedRow?.matricule === row.matricule"></mat-row>

  </mat-table>
</div>
