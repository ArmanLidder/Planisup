<div class="search-container">
  <div class="content">
    <div class="content-search-bar">
      <app-gsup-input
        [size]="'large'"
        [image]="'./../../../assets/search.png'"
        [placeholder]="'Rechercher des cours...'"
        (value)="sendValue($event)"
      ></app-gsup-input>
    </div>
    <div class="content-search-list-courses">
      <div class="content-course" *ngFor="let course of courses">
        {{ course.sigle }} - {{ course.titre }}
      </div>
    </div>
  </div>
</div>
